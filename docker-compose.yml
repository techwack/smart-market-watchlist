# Only needed for the optional `postgres` profile. The default profile runs
# on file-based H2 with nothing installed — see application.yml.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: watchlist
      POSTGRES_USER: watchlist
      POSTGRES_PASSWORD: watchlist
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U watchlist -d watchlist"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
