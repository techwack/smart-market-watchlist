# Production-shaped profile: Postgres via docker-compose, Redis available.
# Activate with: mvn spring-boot:run -Dspring-boot.run.profiles=postgres
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/watchlist
    driver-class-name: org.postgresql.Driver
    username: watchlist
    password: watchlist

  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.PostgreSQLDialect

  data:
    redis:
      host: localhost
      port: 6379
