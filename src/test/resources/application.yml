# Tests run fully self-contained: H2 in place of Postgres, so `mvn test`
# works on a clean machine with no Docker running. Production config stays
# on Postgres — the JPA mappings are identical either way.
spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
